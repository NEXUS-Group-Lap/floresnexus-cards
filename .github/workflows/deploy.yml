name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install La Morenita dependencies
        run: npm ci
        working-directory: pulperia-la-morenita

      - name: Build La Morenita site
        run: npm run build
        working-directory: pulperia-la-morenita
        env:
          SITE_URL: https://floresnexus.cards
          BASE_PATH: /lamorenita/

      - name: Merge La Morenita into dist
        run: |
          rm -rf dist/lamorenita
          mkdir -p dist/lamorenita
          cp -r pulperia-la-morenita/dist/. dist/lamorenita/

      - name: Install Professional Drain Cleaning dependencies
        run: npm ci
        working-directory: professional-drain-cleaning

      - name: Build Professional Drain Cleaning site
        run: npm run build
        working-directory: professional-drain-cleaning
        env:
          SITE_URL: https://floresnexus.cards
          BASE_PATH: /professionaldraincleaning/

      - name: Merge Professional Drain Cleaning into dist
        run: |
          rm -rf dist/professionaldraincleaning
          mkdir -p dist/professionaldraincleaning
          cp -r professional-drain-cleaning/dist/. dist/professionaldraincleaning/

      - name: Install Las Delicias dependencies
        run: npm ci
        working-directory: las-delicias

      - name: Build Las Delicias site
        run: npm run build
        working-directory: las-delicias
        env:
          SITE_URL: https://floresnexus.cards
          BASE_PATH: /lasdelicias/

      - name: Merge Las Delicias into dist
        run: |
          rm -rf dist/lasdelicias
          mkdir -p dist/lasdelicias
          cp -r las-delicias/dist/. dist/lasdelicias/

      - name: Install JCP dependencies
        run: npm ci
        working-directory: JCP

      - name: Build JCP site
        run: npx vinext build
        working-directory: JCP
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /JCP
          NEXT_PUBLIC_BASE_PATH: /JCP

      - name: Merge JCP into dist
        run: |
          rm -rf dist/JCP
          mkdir -p dist/JCP
          cp -r JCP/dist/client/. dist/JCP/
          rm -rf dist/JCP/.sites-runtime dist/JCP/.vite
          # vinext does not support Next's basePath alongside output:"export"
          # (it 404s every route), so the JS/CSS assets it emits still use
          # root-absolute "/assets/..." URLs. Rewrite those to live under
          # /JCP/assets/ so they resolve once served from that subpath.
          grep -rlZ '"/assets/' dist/JCP --include='*.html' --include='*.js' --include='*.css' | xargs -0 -r sed -i 's#"/assets/#"/JCP/assets/#g'
          # Vite's own client-side chunk/CSS preloader also hardcodes a "/"
          # base when basePath isn't configured, so lazy-loaded chunks (e.g.
          # the map component) 404 in the browser and crash the page. Patch
          # that compiled helper directly — see __vitePreload in Vite's
          # preload-helper source.
          grep -rlZ 'function(e){return`/`+e}' dist/JCP --include='*.js' | xargs -0 -r sed -i 's#function(e){return`/`+e}#function(e){return`/JCP/`+e}#g'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
