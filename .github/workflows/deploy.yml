name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install La Morenita dependencies
        run: npm ci
        working-directory: pulperia-la-morenita

      - name: Build La Morenita site
        run: npm run build
        working-directory: pulperia-la-morenita
        env:
          SITE_URL: https://floresnexus.cards
          BASE_PATH: /lamorenita/

      - name: Merge La Morenita into dist
        run: |
          rm -rf dist/lamorenita
          mkdir -p dist/lamorenita
          cp -r pulperia-la-morenita/dist/. dist/lamorenita/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
